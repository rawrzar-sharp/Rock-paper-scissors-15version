services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rock-paper-scissors-15version-rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  flask_backend:
    build:
      context: ./backend
    command: python app.py
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  websocket_server:
      build:
        context: ./backend
      command: uvicorn server:app --host 0.0.0.0 --port 8000
      ports:
        - "8000:8000"
      environment:
        - REDIS_URL=redis://redis:6379/0
        - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/%2F
      depends_on:
        redis:
          condition: service_started
        rabbitmq:
          condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    depends_on:
      flask_backend:
        condition: service_started
      websocket_server:
        condition: service_started
